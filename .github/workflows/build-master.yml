name: Build master and publish snapshot to Maven Central
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central-portal
          server-username-env-var: SONATYPE_USER # env variable for username
          server-password-env-var: SONATYPE_PASSWORD # env variable for token
          gpg-private-key: ${{ secrets.GPG_KEYS }}
          gpg-passphrase-env-var: GPG_PASSPHRASE # env variable for passphrase
      - name: Build, test and deploy snapshot to Maven Central
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --no-transfer-progress --batch-mode clean deploy -Prelease

  release-notes:
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Release Drafter
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
