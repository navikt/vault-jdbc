name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username-env-var: SONATYPE_USER # env variable for username
          server-password-env-var: SONATYPE_PASSWORD # env variable for token
          gpg-private-key: ${{ secrets.GPG_KEYS }}
          gpg-passphrase-env-var: GPG_PASSPHRASE # env variable for passphrase

      - name: Publish artifact
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must use the format X.Y.Z"
            exit 1
          fi
          echo "-- Setting new release version --"
          mvn -B versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
          echo "-- Build, test and deploy release to Sonatype --"
          mvn -B clean deploy -Prelease
