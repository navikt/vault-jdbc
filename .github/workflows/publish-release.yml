name: Publish release

on:
  release:
    types: [published]

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: 11
          cache: maven
          server-id: central
          server-username-env-var: SONATYPE_USER # env variable for username
          server-password-env-var: SONATYPE_PASSWORD # env variable for token
          gpg-private-key: ${{ secrets.GPG_KEYS }}
          gpg-passphrase-env-var: GPG_PASSPHRASE # env variable for passphrase

      - name: Publish artifact
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "-- Setting new release version --"
          mvn -B versions:set -DnewVersion=${{ github.event.release.tag_name }} -DremoveSnapshot=true -DgenerateBackupPoms=false
          echo "-- Build, test and deploy release to Sonatype --"
          mvn -B clean deploy -Prelease
